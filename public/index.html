<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SyncPlay</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <style>
    @media (min-width: 1024px) {
      .chat-panel {
        position: sticky;
        top: 0;
        align-self: stretch;
        height: 100vh;
        z-index: 1;
      }
    }

    .message-reactions {
      margin-top: 4px;
      display: inline-flex;
      gap: 4px;
      font-size: 0.8rem;
      opacity: 0.9;
    }
    .message-reactions .reaction {
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(55, 65, 81, 0.8);
      line-height: 1.2;
    }

    .reaction-picker {
      position: fixed;
      display: none;
      padding: 4px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.98);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 2000;
      gap: 4px;
    }
    .reaction-picker button {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <div id="joinModal" class="modal-backdrop" aria-modal="true" role="dialog">
    <div class="modal">
      <h2>Join the Movie Date</h2>
      <label>
        Username
        <input id="usernameInput" type="text" maxlength="20" placeholder="Your name" />
      </label>
      <div class="avatar-picker">
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>
      <button id="joinBtn" disabled style="width:100%">Join</button>
    </div>
  </div>

  <div class="app">
    <div class="video-panel">
      <div class="video-wrap" id="videoWrap">
        <video id="video" preload="metadata" crossorigin="anonymous"></video>
      </div>

      
      <div class="mini-controls">
        <button id="playPauseBtn" title="Play/Pause">▶</button>
        <button id="fsBtn" title="Fullscreen">⛶</button>
      </div>

      <div class="controls">
        <div class="controls-row">
          
          <input type="range" id="seekBar" min="0" max="1000" value="0" step="1" />
          <span id="timeInfo">00:00 / 00:00 (-00:00)</span>
        </div>
        <div class="controls-row">
          <label>Vol
            <input type="range" id="volumeBar" min="0" max="1" value="1" step="0.01" />
          </label>
          <button id="subToggleBtn" title="Toggle Subtitles">CC</button>
          <label>Font
            <input type="range" id="subFontSize" min="14" max="42" value="26" step="1" />
          </label>
          <div class="sub-offset">
            <button id="subBack1000">-1000ms</button>
            <button id="subBack200">-200ms</button>
            <input id="subOffsetInput" type="number" value="0" step="50" /> ms
            <button id="subFwd200">+200ms</button>
            <button id="subFwd1000">+1000ms</button>
            <label><input type="checkbox" id="subBroadcast"> Broadcast</label>
          </div>
          <button id="syncNowBtn">Sync Now</button>
          
          <label><input type="checkbox" id="notifyToggle" checked> Notify</label>
        </div>
      </div>
    </div>

    <aside class="chat-panel">
      <div class="made-with">
        <a href="https://github.com/folliejester/SyncPlay" target="_blank" rel="noopener noreferrer">SyncPlay</a> 
        Made with ❤️ by
        <a href="https://github.com/folliejester/" target="_blank" rel="noopener noreferrer">folliejester</a>
        <br> Love my work? <a href="https://donate.rxo.me" target="_blank">Click here to Donate</a>!
      </div>
      <div class="chat-header">
        <span>Chat</span>
        <button id="editProfileBtn" class="ghost-btn" title="Change name &amp; avatar">Edit User</button>
      </div>
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" type="text" placeholder="Type a message..." />
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>

  
  <nav class="bottom-nav" role="tablist" aria-label="Sections">
    <button id="tabChatBtn" role="tab" aria-controls="chatTab" aria-selected="true">Chat</button>
    <button id="tabControlsBtn" role="tab" aria-controls="controlsTab" aria-selected="false">Controls</button>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
